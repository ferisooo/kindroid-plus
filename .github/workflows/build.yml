name: Build APK

# On every push to main or a claude/ work branch, and by hand from the Actions page.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk KindroidPlus.apk
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app
          path: KindroidPlus.apk
      # A plain download link that works on a phone:
      # https://github.com/ferisooo/kindroid-plus/releases/latest/download/KindroidPlus.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: KindroidPlus.apk
